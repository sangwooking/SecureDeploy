name: insecure-deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: docker/login-action@master
      - name: Install deploy tool
        run: curl http://example.com/install.sh | sh
      - name: Print secret for debugging
        run: echo ${{ secrets.PROD_DEPLOY_TOKEN }}
      - name: Deploy
        run: ./deploy.sh
