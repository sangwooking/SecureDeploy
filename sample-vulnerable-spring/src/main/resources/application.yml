debug: true

spring:
  datasource:
    url: jdbc:h2:mem:vulnerable-demo
    username: demo_user
    password: hardcoded-db-password
  jpa:
    show-sql: true

jwt:
  secret: short

management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  error:
    include-stacktrace: always
  servlet:
    session:
      cookie:
        secure: false
        http-only: false
