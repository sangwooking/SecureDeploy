plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.securedeploy'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
    implementation 'com.github.librepdf:openpdf:1.3.39'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.yaml:snakeyaml'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    inputs.files(fileTree('analyzers/typescript') {
        include '**/*.mjs', 'package.json', 'package-lock.json'
        exclude 'node_modules/**'
    }).withPropertyName('typeScriptAnalyzer').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree('analyzers/python') { include '*.py' })
            .withPropertyName('pythonAnalyzer').withPathSensitivity(PathSensitivity.RELATIVE)
}

def javaSqlWorkerJar = tasks.register('javaSqlWorkerJar', Jar) {
    dependsOn tasks.named('compileJava')
    from(tasks.named('compileJava').flatMap { it.destinationDirectory }) {
        include 'com/securedeploy/analysis/javaflow/JavaSqlWorker*.class'
    }
    archiveFileName = 'java-sql-worker.jar'
    destinationDirectory = layout.buildDirectory.dir('analyzers')
    manifest { attributes 'Main-Class': 'com.securedeploy.analysis.javaflow.JavaSqlWorker' }
}

tasks.named('processResources') {
    dependsOn javaSqlWorkerJar
    from(javaSqlWorkerJar.flatMap { it.archiveFile }) { into 'analyzers' }
}
