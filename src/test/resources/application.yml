spring:
  datasource:
    url: jdbc:h2:mem:securedeploy-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

securedeploy:
  threat-intelligence:
    enabled: false
  sca:
    enabled: false
  storage:
    temp-dir: ${java.io.tmpdir}/securedeploy-test
  jwt:
    secret: securedeploy-test-signing-key-not-for-production-0001
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
