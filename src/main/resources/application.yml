spring:
  application:
    name: securedeploy-backend
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
      file-size-threshold: 0B
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securedeploy}
    username: ${DB_USERNAME:securedeploy}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

securedeploy:
  threat-intelligence:
    enabled: ${THREAT_INTELLIGENCE_ENABLED:true}
    timeout-seconds: 5
    budget-seconds: 20
    max-cves: 300
    cache-ttl-seconds: 21600
    failure-backoff-seconds: 60
    epss-max-age-days: 2
  risk:
    epss:
      blocking-score: ${EPSS_BLOCKING_SCORE:0.5}
      blocking-percentile: ${EPSS_BLOCKING_PERCENTILE:0.95}
  sca:
    enabled: true
    timeout-seconds: 5
    budget-seconds: 30
    max-queries: 500
    max-advisories: 100
  storage:
    temp-dir: ${java.io.tmpdir}/securedeploy
    max-expanded-size: 1GB
    max-archive-entries: 50000
    max-analysis-file-size: 32MB
    max-analysis-total-size: 128MB
    max-analysis-lines: 500000
  ai:
    provider: ${AI_PROVIDER:template}
    usage-tracking-enabled: true
    semantic:
      max-slices: 4
      max-requests: 1
      max-context-chars: 24000
      max-snippet-chars: 1800
      max-output-tokens: 4000
      max-candidates: 12
      max-indexed-files: 200
      max-indexed-chars: 2000000
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4-mini}
      timeout-seconds: 30
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
