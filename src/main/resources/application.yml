spring:
  application:
    name: securedeploy-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securedeploy}
    username: ${DB_USERNAME:securedeploy}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

securedeploy:
  threat-intelligence:
    enabled: ${THREAT_INTELLIGENCE_ENABLED:true}
    timeout-seconds: 5
    budget-seconds: 20
    max-cves: 300
    cache-ttl-seconds: 21600
    failure-backoff-seconds: 60
    epss-max-age-days: 2
  risk:
    epss:
      blocking-score: ${EPSS_BLOCKING_SCORE:0.5}
      blocking-percentile: ${EPSS_BLOCKING_PERCENTILE:0.95}
  sca:
    enabled: true
    timeout-seconds: 5
    budget-seconds: 30
    max-queries: 500
    max-advisories: 100
  storage:
    temp-dir: ${java.io.tmpdir}/securedeploy
  ai:
    provider: ${AI_PROVIDER:template}
    usage-tracking-enabled: true
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4-mini}
      timeout-seconds: 30
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
