spring:
  application:
    name: securedeploy-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securedeploy}
    username: ${DB_USERNAME:securedeploy}
    password: ${DB_PASSWORD:securedeploy}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

securedeploy:
  storage:
    temp-dir: ${java.io.tmpdir}/securedeploy
  ai:
    provider: ${AI_PROVIDER:template}
    usage-tracking-enabled: true
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4-mini}
      timeout-seconds: 30
  jwt:
    secret: ${JWT_SECRET:securedeploy-local-dev-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

