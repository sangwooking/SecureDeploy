# Functional fallback on the SAME matched Backend/Worker. New storage remains readable/editable.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
securedeploy.ai.provider=TEMPLATE
securedeploy.ai.ledger.enabled=false
securedeploy.ai.patch-policy.external-enabled=false
securedeploy.editing.automation-enabled=false
securedeploy.editing.npm-generation-enabled=false
